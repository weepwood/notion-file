name: Finalize v0.7.0 Queue

on:
  push:
    branches: [feat/persistent-transfer-queue-v0.7.0]
    paths:
      - scripts/finalize_v070_queue.py
      - .github/workflows/finalize-v070-queue.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/finalize_v070_queue.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src-tauri/src src/App.tsx
          git commit -m "fix: 完善队列恢复与进度持久化"
          git push
