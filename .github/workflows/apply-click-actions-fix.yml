name: Apply Click Actions Fix

on:
  push:
    branches: [fix/windows-path-notion-ui-v0.7.1]
    paths:
      - scripts/fix_click_actions.py
      - .github/workflows/apply-click-actions-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install opener dependencies
        run: |
          npm install @tauri-apps/plugin-opener@^2.0.0 --save
          cd src-tauri
          cargo add tauri-plugin-opener@2
      - name: Apply source changes
        run: python scripts/fix_click_actions.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/App.tsx src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/src/lib.rs src-tauri/capabilities/default.json
          git commit -m "fix: 恢复下载对话框与 Notion 页面打开"
          git push
