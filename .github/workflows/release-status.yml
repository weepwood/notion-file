name: Release Status

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record release result
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          mkdir -p .github/status
          cat > .github/status/release.json <<EOF
          {
            "conclusion": "${CONCLUSION}",
            "runId": "${RUN_ID}",
            "headSha": "${HEAD_SHA}",
            "runUrl": "${RUN_URL}",
            "recordedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit release result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/release.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 记录发布流水线状态"
          git push origin main
