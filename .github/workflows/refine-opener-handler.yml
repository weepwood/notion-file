name: Refine Opener Handler

on:
  push:
    branches: [fix/windows-path-notion-ui-v0.7.1]
    paths:
      - scripts/refine_opener_handler.py
      - .github/workflows/refine-opener-handler.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refine_opener_handler.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          git commit -m "refactor: 收紧 Notion 外部链接打开范围"
          git push
