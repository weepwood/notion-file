name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Generate Tauri icons
        run: npm install
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies and generate icons
        run: npm install
      - name: Cargo check on Windows
        working-directory: src-tauri
        run: cargo check

  macos-apple-silicon:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: npm install
      - name: Build Apple Silicon DMG with retry
        shell: bash
        run: |
          set -uo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "DMG build attempt ${attempt}/${max_attempts}"
            if npm run desktop:build:mac-arm64; then
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Apple Silicon DMG build failed after ${max_attempts} attempts." >&2
              exit 1
            fi

            # GitHub macOS runners occasionally leave diskimages-helper processes
            # behind after bundle_dmg.sh fails. Clear only the transient DMG state.
            pkill -9 -f 'diskimages-help|diskimages-helper' || true
            rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
            sleep $((15 * attempt))
          done
      - name: Verify Apple Silicon DMG
        shell: bash
        run: |
          set -euo pipefail
          find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit | grep -q .
