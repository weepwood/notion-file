name: Apply v0.7.0 Queue

on:
  push:
    branches: [feat/persistent-transfer-queue-v0.7.0]
    paths:
      - scripts/apply_v070_queue.py
      - .github/workflows/apply-v070-queue.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply queue implementation
        run: python scripts/apply_v070_queue.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json src-tauri src scripts src/App.tsx src/types.ts src/advanced.css
          git commit -m "feat: 实现 v0.7.0 持久化上传队列"
          git push
