name: Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - package.json
      - public/**
      - src/**
      - src-tauri/Cargo.toml
      - src-tauri/src/**
      - src-tauri/tauri.conf.json

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows NSIS installer with retry
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "NSIS build attempt $attempt of $maxAttempts"
            npm run desktop:build
            if ($LASTEXITCODE -eq 0) {
              Write-Host "NSIS build succeeded on attempt $attempt"
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "Windows NSIS build failed after $maxAttempts attempts."
            }

            $delay = 20 * $attempt
            Write-Warning "NSIS build failed, retrying in $delay seconds."
            $global:LASTEXITCODE = 0
            Start-Sleep -Seconds $delay
          }

      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $source = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" -File | Select-Object -First 1
          if (-not $source) {
            throw "No NSIS installer was generated."
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $target = "release-assets/Notion.File_$($config.version)_x64-setup.exe"
          Copy-Item $source.FullName $target -Force
          Write-Host "Prepared Windows asset: $target"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-nsis
          path: release-assets/*.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon DMG
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Apple Silicon DMG
        run: npm run desktop:build:mac-arm64

      - name: Prepare macOS release asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SOURCE=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)
          if [[ -z "$SOURCE" ]]; then
            echo "No Apple Silicon DMG was generated." >&2
            exit 1
          fi
          mkdir -p release-assets
          TARGET="release-assets/Notion.File_${VERSION}_aarch64.dmg"
          cp "$SOURCE" "$TARGET"
          echo "Prepared macOS asset: $TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon-dmg
          path: release-assets/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          WINDOWS_ASSET="Notion.File_${VERSION}_x64-setup.exe"
          MAC_ASSET="Notion.File_${VERSION}_aarch64.dmg"

          test -f "release-assets/${WINDOWS_ASSET}"
          test -f "release-assets/${MAC_ASSET}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Notion File $TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Notion File $TAG" \
              --generate-notes
          fi

          mapfile -t ASSETS < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          for ASSET in "${ASSETS[@]}"; do
            if [[ "$ASSET" != "$WINDOWS_ASSET" && "$ASSET" != "$MAC_ASSET" ]]; then
              echo "Deleting extra release asset: $ASSET"
              gh release delete-asset "$TAG" "$ASSET" --yes
            fi
          done

          mapfile -t REMAINING < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          mapfile -t EXPECTED < <(printf '%s\n' "$WINDOWS_ASSET" "$MAC_ASSET" | sort)

          if [[ "${#REMAINING[@]}" -ne 2 || "${REMAINING[*]}" != "${EXPECTED[*]}" ]]; then
            printf 'Release asset validation failed. Remaining assets: %s\n' "${REMAINING[*]}" >&2
            exit 1
          fi

          printf 'Release %s assets:\n- %s\n- %s\n' "$TAG" "$WINDOWS_ASSET" "$MAC_ASSET"

  record-status:
    name: Record release status
    if: always()
    needs: [windows, macos-arm64, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write release status
        shell: bash
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos-arm64.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CONCLUSION=failure
          if [[ "$WINDOWS_RESULT" == success && "$MACOS_RESULT" == success && "$PUBLISH_RESULT" == success ]]; then
            CONCLUSION=success
          fi

          mkdir -p .github/status
          jq -n \
            --arg conclusion "$CONCLUSION" \
            --arg version "$VERSION" \
            --arg runId "$RUN_ID" \
            --arg headSha "$HEAD_SHA" \
            --arg runUrl "$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windowsResult "$WINDOWS_RESULT" \
            --arg macosResult "$MACOS_RESULT" \
            --arg publishResult "$PUBLISH_RESULT" \
            --arg windowsAsset "Notion.File_${VERSION}_x64-setup.exe" \
            --arg macosAsset "Notion.File_${VERSION}_aarch64.dmg" \
            '{
              conclusion: $conclusion,
              version: $version,
              runId: $runId,
              headSha: $headSha,
              runUrl: $runUrl,
              recordedAt: $recordedAt,
              jobs: {
                windows: $windowsResult,
                macosAppleSilicon: $macosResult,
                publish: $publishResult
              },
              assets: [$windowsAsset, $macosAsset]
            }' > .github/status/release.json

      - name: Commit release status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/release.json
          if git diff --cached --quiet; then
            exit 0
          fi
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          git commit -m "chore: 记录 v${VERSION} 发布状态 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
