name: Apply Upload Diagnostics

on:
  push:
    branches: [feat/upload-diagnostics-v0.6.1]
    paths:
      - scripts/apply_upload_diagnostics.py
      - .github/workflows/apply-upload-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upload-diagnostics-v0.6.1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply source changes
        run: python scripts/apply_upload_diagnostics.py

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json src src-tauri
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat: 增加上传速度与瓶颈诊断"
          git push origin HEAD:feat/upload-diagnostics-v0.6.1
